# registry-policy.dev.example.yaml: template for the dev-mode trust policy.
# The dev server copies this to registry-policy.dev.yaml (gitignored) when that file is missing.
# After editing: run scripts/rebuild_index.py, then restart.
trusted_code:            # check 4: whose Sigstore-signed reference measurements count (must be non-empty)
  - repo: OpenMined/syft-enclave-tinfoil
benchmark_owners:        # check 6: approver email -> display name.
                         # Emails printed by scripts/make_fixtures.py. Never add C6_unlisted_approver's.
  - email: "benchmark_owner@openmined.org"
    display: OpenMined sample benchmark owner  # fixtures/openmined/
  - email: "refusal-evals@example.org"
    display: Synthetic refusal eval owner (synthetic)
  - email: "bio-evals@example.org"
    display: Synthetic bio-risk screen owner (synthetic)
  - email: "honesty-evals@example.org"
    display: Synthetic honesty probe owner (synthetic)
